name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-user:
    name: Test (user mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run tests as user
        run: |
          bats tests/

      - name: Run shellcheck
        run: |
          shellcheck backup-restic install.sh

  test-root:
    name: Test (root mode)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and dependencies
        run: |
          apt-get update
          apt-get install -y bats e2fsprogs

      - name: Run tests as root
        run: |
          bats tests/

      - name: Run shellcheck
        run: |
          shellcheck backup-restic install.sh tests/*.bash

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck -x backup-restic install.sh tests/*.bash
